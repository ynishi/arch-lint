[package]
name = "arch-lint-cli"
description = "CLI tool for arch-lint architecture linter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# cargo-binstall resolves this against `.github/workflows/release.yml`'s
# archive naming (issue #14). `{ repo }` reads from `package.repository`
# above (inherited from `[workspace.package]`, confirmed via `cargo
# metadata`). With `pkg-fmt = "tgz"`, binstall tries both the ".tgz" and
# ".tar.gz" extensions for `{ archive-suffix }` against the URL above (the
# workflow produces ".tar.gz"); the Windows override's "zip" format resolves
# `{ archive-suffix }` to ".zip" instead. `bin-dir` has no directory
# component because taiki-e/upload-rust-binary-action's `archive` value in
# the workflow (`arch-lint-$target`, no `/`) puts the binaries at the
# archive root rather than in a subdirectory.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/arch-lint-v{ version }/arch-lint-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "arch-lint"
path = "src/main.rs"

# Cargo's external-subcommand convention: a `cargo-<name>` binary on PATH is
# invoked by `cargo <name> <args>` as `cargo-<name> <name> <args>`. Shares
# `main.rs` with the `arch-lint` binary above, which strips the leading
# `arch-lint` argument this way arrives with (issue #12).
[[bin]]
name = "cargo-arch-lint"
path = "src/main.rs"

[dependencies]
arch-lint.workspace = true
arch-lint-core.workspace = true
arch-lint-rules.workspace = true
arch-lint-ts.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
