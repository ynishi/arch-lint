[package]
name = "arch-lint-cli"
description = "CLI tool for arch-lint architecture linter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "arch-lint"
path = "src/main.rs"

# Cargo's external-subcommand convention: a `cargo-<name>` binary on PATH is
# invoked by `cargo <name> <args>` as `cargo-<name> <name> <args>`. Shares
# `main.rs` with the `arch-lint` binary above, which strips the leading
# `arch-lint` argument this way arrives with (issue #12).
[[bin]]
name = "cargo-arch-lint"
path = "src/main.rs"

[dependencies]
arch-lint.workspace = true
arch-lint-core.workspace = true
arch-lint-rules.workspace = true
arch-lint-ts.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
